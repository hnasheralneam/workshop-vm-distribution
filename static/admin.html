<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Workshop VMs Admin</title>
   <link rel="stylesheet" href="/style.css">
</head>

<body class="admin">
   <h1>Workshop VMs Admin</h1>
   <p class="subtitle">Provision and tear down workshop VMs</p>

   <div class="card job-status">
      <h2>Job Status</h2>
      <p id="job-status">No job running.</p>
      <div id="job-log"></div>
   </div>

   <div class="card">
      <div class="card-header">
         <h2>Pools</h2>
         <nav id="pool-tabs" class="pool-tabs">
            <button type="button" class="pool-tab active" data-group="All">All <span class="pool-tab-count"></span></button>
            <button type="button" class="pool-tab" data-group="Workshop">Workshop <span class="pool-tab-count"></span></button>
            <button type="button" class="pool-tab" data-group="Challenge">Challenge <span class="pool-tab-count"></span></button>
            <button type="button" class="pool-tab" data-group="Generic">Generic <span class="pool-tab-count"></span></button>
         </nav>
         <button type="button" id="new-deploy-btn" class="deploy-btn">New pool</button>
      </div>
      <div class="pool-toolbar">
         <input id="pool-search" type="search" placeholder="Search pools" autocomplete="off">
         <div id="pool-filters">
            <button type="button" class="filter-chip active" data-filter="all">All</button>
            <button type="button" class="filter-chip" data-filter="in-use">In use</button>
            <button type="button" class="filter-chip" data-filter="free">Free</button>
            <button type="button" class="filter-chip" data-filter="dispenser">Dispenser</button>
            <button type="button" class="filter-chip" data-filter="private">Private</button>
         </div>
         <select id="pool-sort" aria-label="Sort pools">
            <option value="recent">Recent</option>
            <option value="name">Name</option>
            <option value="os">OS</option>
            <option value="private">Private</option>
            <option value="dispenser">Dispenser</option>
         </select>
      </div>
      <div id="redeploy-rows"></div>
      <p id="pool-empty" hidden>No pools match.</p>
   </div>

   <div class="card">
      <div class="card-header">
         <h2>Virtual Machines</h2>
         <div class="row">
            <button class="secondary" id="extend-selected-btn" disabled>Extend Selected</button>
            <button class="danger" id="destroy-selected-btn" disabled>Destroy Selected</button>
            <button class="danger" id="destroy-all-btn">Destroy All</button>
         </div>
      </div>
      <div class="table-wrap">
         <table>
            <thead>
               <tr>
                  <th></th>
                  <th>VMID</th>
                  <th>Pool</th>
                  <th>VM Name</th>
                  <th>Status</th>
                  <th>Expires</th>
               </tr>
            </thead>
            <tbody id="pool-rows"></tbody>
         </table>
      </div>
   </div>

   <p class="page-footer">
      <button type="button" id="logs-btn" class="secondary">View server logs</button>
   </p>

   <dialog id="deploy-dialog">
      <form id="provision-form">
         <div class="dialog-body">
            <div class="deploy-head">
               <h2 id="deploy-title">New pool</h2>
               <span class="pool-code" id="deploy-code" data-tip="Copy claim code" role="button" tabindex="0" hidden></span>
            </div>
            <p class="hint" id="deploy-hint"></p>

            <section class="form-section">
               <h3>Pool</h3>
               <label for="pool_name">Pool name</label>
               <input id="pool_name" name="pool_name" type="text" placeholder="Defaults to OS label">
               <label>Group</label>
               <input type="hidden" name="group">
               <div class="segmented" data-input="group">
                  <button type="button" class="seg-btn" data-value="Workshop">Workshop</button>
                  <button type="button" class="seg-btn" data-value="Challenge">Challenge</button>
                  <button type="button" class="seg-btn" data-value="Generic">Generic</button>
               </div>
            </section>

            <section class="form-section">
               <h3>Template</h3>
               <label>Access method</label>
               <input type="hidden" name="template_vm_access_method">
               <div class="segmented" data-input="template_vm_access_method">
                  <button type="button" class="seg-btn" data-value="ssh"><span>SSH</span><span class="seg-sub">Linux</span></button>
                  <button type="button" class="seg-btn" data-value="vnc"><span>VNC</span><span class="seg-sub">Linux desktop</span></button>
                  <button type="button" class="seg-btn" data-value="rdp"><span>RDP</span><span class="seg-sub">Windows</span></button>
               </div>
               <div class="field-pair">
                  <div>
                     <label for="template_vm_id">Template VM ID</label>
                     <input id="template_vm_id" name="template_vm_id" type="number" required>
                     <p class="hint">ID of the Proxmox template to clone.</p>
                  </div>
                  <div>
                     <label for="template_vm_username">Template username</label>
                     <input id="template_vm_username" name="template_vm_username" type="text" required>
                  </div>
               </div>
               <label for="template_vm_password">Template password</label>
               <input id="template_vm_password" name="template_vm_password" type="password" required>
            </section>

            <section class="form-section">
               <h3>Claims</h3>
               <div class="field-pair">
                  <div>
                     <label for="vm_count">VM count</label>
                     <input id="vm_count" name="vm_count" type="number" min="1" value="5" required>
                  </div>
                  <div>
                     <label for="vm_duration_hours">Claim validity (hours)</label>
                     <input id="vm_duration_hours" name="vm_duration_hours" type="number" min="0.5" step="any" value="2" required>
                     <p class="hint">Claimed VMs and their links expire after this long.</p>
                  </div>
               </div>
               <label class="switch-row">
                  <span class="switch-text">
                     <span class="switch-title">Dispenser</span>
                     <span class="switch-desc">Clone a new VM when the pool runs empty</span>
                  </span>
                  <input id="dispenser" type="checkbox">
                  <span class="switch"></span>
               </label>
               <label class="switch-row">
                  <span class="switch-text">
                     <span class="switch-title">Private</span>
                     <span class="switch-desc">Hidden from the main page; claim only with the pool code</span>
                  </span>
                  <input id="private" type="checkbox">
                  <span class="switch"></span>
               </label>
            </section>
         </div>
         <div class="modal-actions">
            <button type="button" class="secondary" id="deploy-cancel-btn">Cancel</button>
            <button type="submit" id="provision-btn">Provision</button>
         </div>
      </form>
   </dialog>

   <dialog id="logs-dialog">
      <h2>Server log</h2>
      <div class="logs-toolbar">
         <input id="log-search" type="search" placeholder="Search lines" autocomplete="off">
         <button type="button" id="logs-refresh-btn" class="secondary">Refresh</button>
      </div>
      <div id="server-log"></div>
      <p id="log-count" class="hint"></p>
      <div class="modal-actions">
         <button type="button" class="secondary" id="logs-close-btn">Close</button>
      </div>
   </dialog>

   <script src="/scripts/admin.js"></script>
</body>

</html>
