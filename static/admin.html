<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>DawgSec Workshop Admin</title>
   <link rel="stylesheet" href="/style.css">
</head>

<body class="admin">
   <h1>DawgSec Workshop Admin</h1>
   <p class="subtitle">Provision and tear down workshop VMs</p>

   <div class="grid">
      <div class="card">
         <div class="card-header">
            <h2>Pools</h2>
            <button type="button" id="new-deploy-btn">New deployment</button>
         </div>
         <div id="redeploy-rows"></div>
      </div>

      <div class="card">
         <h2>Destroy VMs</h2>
         <div class="row">
            <button class="danger" id="destroy-all-btn">Destroy All</button>
            <button class="danger" id="destroy-expired-btn">Destroy Expired</button>
            <button class="danger" id="destroy-selected-btn">Destroy Selected</button>
            <button class="secondary" id="refresh-pool-btn">Refresh</button>
         </div>
         <table>
            <thead>
               <tr>
                  <th></th>
                  <th>VMID</th>
                  <th>Pool</th>
                  <th>Student</th>
                  <th>Status</th>
                  <th>Expires</th>
               </tr>
            </thead>
            <tbody id="pool-rows"></tbody>
         </table>
      </div>
   </div>

   <div class="card job-status">
      <h2>Job Status</h2>
      <p id="job-status">No job running.</p>
      <div id="job-log"></div>
   </div>

   <dialog id="deploy-dialog">
      <h2 id="deploy-title">New deployment</h2>
      <form id="provision-form">
         <label for="pool_name">Pool name</label>
         <input id="pool_name" name="pool_name" type="text" placeholder="(optional — defaults to OS label)">

         <label for="pool_code">Pool code</label>
         <input id="pool_code" name="pool_code" type="text" placeholder="(leave blank to auto-generate)" style="text-transform: uppercase">

         <label for="vm_count">VM count</label>
         <input id="vm_count" name="vm_count" type="number" min="1" value="5">

         <label for="vm_duration_hours">VM duration (hours)</label>
         <input id="vm_duration_hours" name="vm_duration_hours" type="number" min="0.5" step="0.5" value="2">

         <label style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; color: #e6e6e6;">
            <input id="dispenser" type="checkbox" style="width: auto">
            Dispenser — provision a VM whenever someone loads the pool link and none are free
         </label>

         <fieldset>
            <legend>Template</legend>
            <label for="template_vm_access_method">Access method</label>
            <select id="template_vm_access_method" name="template_vm_access_method">
               <option value="ssh">SSH (Linux)</option>
               <option value="vnc">VNC (Linux desktop)</option>
               <option value="rdp">RDP (Windows)</option>
            </select>
            <label for="template_vm_id">Template VM ID</label>
            <input id="template_vm_id" name="template_vm_id" type="number">
            <label for="template_vm_username">Template username</label>
            <input id="template_vm_username" name="template_vm_username" type="text">
            <label for="template_vm_password">Template password</label>
            <input id="template_vm_password" name="template_vm_password" type="password">
         </fieldset>

         <div class="modal-actions">
            <button type="button" class="secondary" id="deploy-cancel-btn">Cancel</button>
            <button type="submit" id="provision-btn">Provision</button>
         </div>
      </form>
   </dialog>

   <script src="/scripts/admin.js"></script>
</body>

</html>
