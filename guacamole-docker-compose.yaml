services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd
    networks:
      - guac_network
    restart: always

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: guacamole
    environment:
      GUACD_HOSTNAME: guacd

      # Must be exactly 32 hex characters (128-bit)
      JSON_SECRET_KEY: '__GUAC_JSON_KEY__'
    ports:
      - "8080:8080"
    networks:
      - guac_network
    volumes:
      - ./guacamole_home:/etc/guacamole
    depends_on:
      - guacd
    restart: always

networks:
  guac_network:
    driver: bridge
